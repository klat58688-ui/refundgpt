# Render Blueprint — one web service (Docker) + managed PostgreSQL.
# Deploy: Render Dashboard → New → Blueprint → point at this repo.
services:
  - type: web
    name: refundgpt
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: refundgpt-db
          property: connectionString
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_API_KEY
        sync: false        # set in Render dashboard (secret)
      - key: LLM_MODEL
        value: gpt-4o
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false        # set in Render dashboard (secret)
      - key: PAYPAL_CLIENT_SECRET
        sync: false        # set in Render dashboard (secret)
      - key: AUTO_REFUND_THRESHOLD
        value: "100"
      - key: API_KEY
        sync: false        # optional shared key for the public demo
      - key: CORS_ORIGINS
        value: ""          # same-origin in production; leave empty

databases:
  - name: refundgpt-db
    plan: free
